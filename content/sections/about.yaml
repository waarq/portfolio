headline: I've always been fascinated by products that feel effortless.
paragraphs:
  - >-
    The kind people recommend without thinking. That's what I enjoy building:
    software that disappears into the task, and design that earns trust in the
    first three seconds.
  - >-
    I work across the stack, but I spend most of my attention on the parts
    people actually feel: pacing, hierarchy, the half-second before something
    responds.
